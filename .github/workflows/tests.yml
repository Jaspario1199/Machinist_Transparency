name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Fail if the generated demo config is stale
        run: |
          node scripts/build-demo-config.mjs
          git diff --exit-code demo/data/downtime-reasons.js

      - name: Scan for credentials and production addresses
        run: bash scripts/scan-secrets.sh

      - name: Run tests
        run: npm test
